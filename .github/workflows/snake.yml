name: 🐍 Generate Contribution Snake

# GitHub 只在默认分支上读取 README，因此这个工作流放在 main。
# 生成的 SVG 会被推到 output 分支，README 通过 raw 链接引用。

on:
  schedule:
    # UTC 00:17 / 12:17 → 北京时间 08:17 / 20:17，每 12 小时刷新一次
    - cron: "17 0,12 * * *"
  workflow_dispatch:      # 支持手动触发
  push:
    branches: [main]
    paths:
      - ".github/workflows/snake.yml"

permissions:
  contents: write         # 推送到 output 分支需要写权限

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3.5.0
        id: snake
        with:
          github_user_name: hyczq
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
